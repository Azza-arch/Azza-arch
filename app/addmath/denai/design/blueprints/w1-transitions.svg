<text x="520" y="28">P# = laluan pilihan · grid 1 jubin = 54 unit, label setiap 10 jubin · senarai tujuan di bawah setiap panel cadangan</text></g></g><g transform="translate(0,44)"><rect width="288" height="240" fill="#eef7f5"/><line x1="0" y1="0" x2="0" y2="240" stroke="#cfe0dc" stroke-width="1"/><text x="2" y="237" font-size="9" fill="#7a8f8a">0</text><line x1="80" y1="0" x2="80" y2="240" stroke="#cfe0dc" stroke-width="0.5"/><line x1="160" y1="0" x2="160" y2="240" stroke="#cfe0dc" stroke-width="1"/><text x="162" y="237" font-size="9" fill="#7a8f8a">10</text><line x1="240" y1="0" x2="240" y2="240" stroke="#cfe0dc" stroke-width="0.5"/><rect x="0" y="144" width="64" height="96" fill="#b98557" stroke="#5b3a24" stroke-width="1.2"/><rect x="64" y="128" width="144" height="112" fill="#b98557" stroke="#5b3a24" stroke-width="1.2"/><rect x="208" y="112" width="48" height="128" fill="#b98557" stroke="#5b3a24" stroke-width="1.2"/><rect x="256" y="128" width="32" height="112" fill="#b98557" stroke="#5b3a24" stroke-width="1.2"/><line x1="0" y1="64" x2="16" y2="64" stroke="#d8432b" stroke-width="4.8" stroke-linecap="butt"/><polyline points="64.0,135.2 64.0,119.2 208.0,119.2 208.0,103.2 232.0,103.2" fill="none" stroke="#1f8f4a" stroke-width="3"  stroke-linejoin="round" opacity=".9"/><text x="232" y="91.2" font-size="11" font-weight="bold" fill="#1f8f4a" text-anchor="end">KELUAR ▶</text><line x1="80" y1="128" x2="80" y2="114" stroke="#d8432b" stroke-width="1.5"/><path d="M80,114 l8,3 l-8,3z" fill="#d8432b"/><text x="232" y="72" font-size="10" text-anchor="middle" fill="#203e36" font-style="italic">◆ Gerbang Taman</text><text x="272" y="104" font-size="10" text-anchor="middle" fill="#203e36" font-style="italic">◆ → Lembah</text><text x="6" y="14" font-size="13" font-weight="bold" fill="#203e36">1-1 KELUAR (x 92–110)</text></g><g transform="translate(348,44)"><g transform="translate(0,0)"><rect width="320" height="240" fill="#eef7f5"/><line x1="0" y1="0" x2="0" y2="240" stroke="#cfe0dc" stroke-width="1"/><text x="2" y="237" font-size="9" fill="#7a8f8a">0</text><line x1="80" y1="0" x2="80" y2="240" stroke="#cfe0dc" stroke-width="0.5"/><line x1="160" y1="0" x2="160" y2="240" stroke="#cfe0dc" stroke-width="1"/><text x="162" y="237" font-size="9" fill="#7a8f8a">10</text><line x1="240" y1="0" x2="240" y2="240" stroke="#cfe0dc" stroke-width="0.5"/><line x1="320" y1="0" x2="320" y2="240" stroke="#cfe0dc" stroke-width="1"/><text x="322" y="237" font-size="9" fill="#7a8f8a">20</text><rect x="288" y="208" width="32" height="32" fill="#5fb6ea" opacity=".85"/><rect x="0" y="112" width="96" height="128" fill="#d6a06c" stroke="#5b3a24" stroke-width="1.2"/><rect x="96" y="128" width="48" height="112" fill="#d6a06c" stroke="#5b3a24" stroke-width="1.2"/><rect x="144" y="144" width="48" height="96" fill="#d6a06c" stroke="#5b3a24" stroke-width="1.2"/><rect x="192" y="128" width="96" height="112" fill="#b98557" stroke="#5b3a24" stroke-width="1.2"/><polyline points="16.0,103.2 96.0,103.2 96.0,119.2 144.0,119.2 144.0,135.2 192.0,135.2 192.0,119.2 288.0,119.2 320.0,135.2" fill="none" stroke="#1f8f4a" stroke-width="3"  stroke-linejoin="round" opacity=".9"/><text x="16" y="91.2" font-size="11" font-weight="bold" fill="#1f8f4a">▶ MASUK</text><rect x="43" y="97" width="10" height="10" rx="2" fill="#2e7d5b"/><text x="48" y="93" font-size="9" text-anchor="middle" fill="#2e7d5b" font-weight="bold">Pemandangan lembah</text><line x1="32" y1="112" x2="32" y2="98" stroke="#d8432b" stroke-width="1.5"/><path d="M32,98 l8,3 l-8,3z" fill="#d8432b"/><text x="16" y="72" font-size="10" text-anchor="middle" fill="#203e36" font-style="italic">◆ Gerbang 1-1 di kejauhan</text><text x="6" y="14" font-size="13" font-weight="bold" fill="#203e36">1-2 MASUK (x 0–20)</text></g></g><text x="318" y="164" font-size="28" text-anchor="middle" fill="#1f8f4a">➜</text><text x="6" y="306" font-size="11" fill="#203e36">Keluar 1-1: Gerbang Taman di atas pelantar batu (baris 22) → papan tanda "Lembah Sungai" → tanah menurun ke kanan, sungai berkilau di bawah.</text><text x="6" y="321" font-size="11" fill="#203e36">Masuk 1-2: bermula pada rabung yang SAMA tinggi (baris 22); gerbang 1-1 kelihatan kecil di kiri; turun 3 langkah (22→23→24) ke tebing sungai.</text><text x="6" y="336" font-size="11" fill="#203e36">Dibawa: pokok oak/pain yang sama, gerbang kayu yang sama, sungai pertama kali dilihat dari atas. Tiada perubahan biome.</text><g transform="translate(0,363)"><rect width="256" height="240" fill="#eef7f5"/><line x1="0" y1="0" x2="0" y2="240" stroke="#cfe0dc" stroke-width="1"/><text x="2" y="237" font-size="9" fill="#7a8f8a">0</text><line x1="80" y1="0" x2="80" y2="240" stroke="#cfe0dc" stroke-width="0.5"/><line x1="160" y1="0" x2="160" y2="240" stroke="#cfe0dc" stroke-width="1"/><text x="162" y="237" font-size="9" fill="#7a8f8a">10</text><line x1="240" y1="0" x2="240" y2="240" stroke="#cfe0dc" stroke-width="0.5"/><rect x="0" y="208" width="64" height="32" fill="#5fb6ea" opacity=".85"/><rect x="64" y="128" width="96" height="112" fill="#b98557" stroke="#5b3a24" stroke-width="1.2"/><rect x="160" y="112" width="96" height="128" fill="#b98557" stroke="#5b3a24" stroke-width="1.2"/><line x1="0" y1="128" x2="64" y2="128" stroke="#7a4cc2" stroke-width="4.8" stroke-dasharray="8,4"/><text x="32" y="145.6" font-size="9" text-anchor="middle" fill="#7a4cc2">Jambatan akhir</text><polyline points="64.0,119.2 160.0,119.2 160.0,103.2 208.0,103.2" fill="none" stroke="#1f8f4a" stroke-width="3"  stroke-linejoin="round" opacity=".9"/><text x="208" y="91.2" font-size="11" font-weight="bold" fill="#1f8f4a" text-anchor="end">KELUAR ▶</text><rect x="187" y="97" width="10" height="10" rx="2" fill="#2e7d5b"/><text x="192" y="93" font-size="9" text-anchor="middle" fill="#2e7d5b" font-weight="bold">Tugu batu</text><line x1="80" y1="128" x2="80" y2="114" stroke="#d8432b" stroke-width="1.5"/><path d="M80,114 l8,3 l-8,3z" fill="#d8432b"/><text x="224" y="72" font-size="10" text-anchor="middle" fill="#203e36" font-style="italic">◆ Tugu → runtuhan</text><text x="6" y="14" font-size="13" font-weight="bold" fill="#203e36">1-2 KELUAR (x 74–90)</text></g><g transform="translate(316,363)"><g transform="translate(0,0)"><rect width="256" height="352" fill="#eef7f5"/><line x1="0" y1="0" x2="0" y2="352" stroke="#cfe0dc" stroke-width="1"/><text x="2" y="349" font-size="9" fill="#7a8f8a">0</text><line x1="80" y1="0" x2="80" y2="352" stroke="#cfe0dc" stroke-width="0.5"/><line x1="160" y1="0" x2="160" y2="352" stroke="#cfe0dc" stroke-width="1"/><text x="162" y="349" font-size="9" fill="#7a8f8a">10</text><line x1="240" y1="0" x2="240" y2="352" stroke="#cfe0dc" stroke-width="0.5"/><rect x="112" y="256" width="32" height="96" fill="#5fb6ea" opacity=".85"/><rect x="0" y="240" width="112" height="112" fill="#b98557" stroke="#5b3a24" stroke-width="1.2"/><rect x="144" y="240" width="48" height="112" fill="#b98557" stroke="#5b3a24" stroke-width="1.2"/><rect x="208" y="224" width="48" height="128" fill="#b98557" stroke="#5b3a24" stroke-width="1.2"/><rect x="224" y="256" width="32" height="32" fill="#3c2b22" opacity=".85" rx="8"/><line x1="224" y1="176" x2="256" y2="176" stroke="#e08a2e" stroke-width="4.8" stroke-linecap="butt"/><line x1="112" y1="240" x2="144" y2="240" stroke="#e08a2e" stroke-width="4.8" stroke-linecap="butt"/><polyline points="16.0,231.2 112.0,231.2 144.0,231.2 192.0,231.2 208.0,215.2" fill="none" stroke="#1f8f4a" stroke-width="3"  stroke-linejoin="round" opacity=".9"/><text x="16" y="219.2" font-size="11" font-weight="bold" fill="#1f8f4a">▶ MASUK</text><rect x="251" y="272" width="10" height="10" fill="#7a4cc2" transform="rotate(45 256 277)"/><text x="256" y="268" font-size="9" text-anchor="middle" fill="#7a4cc2" font-weight="bold">∑ C=(F−32)/1.8 (pilihan)</text><line x1="32" y1="240" x2="32" y2="226" stroke="#d8432b" stroke-width="1.5"/><path d="M32,226 l8,3 l-8,3z" fill="#d8432b"/><text x="48" y="208" font-size="10" text-anchor="middle" fill="#203e36" font-style="italic">◆ Batu tanda 1-2</text><text x="6" y="14" font-size="13" font-weight="bold" fill="#203e36">1-3 MASUK (x 0–16)</text></g></g><text x="286" y="483" font-size="28" text-anchor="middle" fill="#1f8f4a">➜</text><text x="6" y="737" font-size="11" fill="#203e36">Keluar 1-2: selepas jambatan akhir, tangga batu lama naik ke pelantar (baris 22) + tugu batu; sungai menyempit ke kanan menjadi anak sungai.</text><text x="6" y="752" font-size="11" fill="#203e36">Masuk 1-3: anak sungai yang SAMA + tugu batu yang sama; runtuhan muncul di kanan. Aras tanah lebih rendah (baris 32) kerana dunia 1-3 lebih tinggi menegak: kamera bermula</text><text x="6" y="767" font-size="11" fill="#203e36">di tebing.</text><text x="6" y="782" font-size="11" fill="#203e36">Dibawa: batu runtuhan (l3-stone) mula muncul di empangan 1-2; air (kincir → empangan → akueduk); pokok hutan yang sama.</text></svg>