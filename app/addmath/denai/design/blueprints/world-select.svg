<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="760" viewBox="0 0 1640 760" font-family="Arial, sans-serif">
  <rect width="1640" height="760" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#203e36">DENAI · Peta Dunia: susun atur UI (seni akhir = world-map-pixel.png, jubin Kenney)</text>
  <text x="20" y="50" font-size="12" fill="#5a6e68">Kiri: desktop 1100×640 · Kanan: telefon (potret dan landskap guna senarai kad yang sama). Wilayah ialah kawasan berbeza, bukan segi empat berulang.</text>
  <!-- desktop frame -->
  <g transform="translate(20,70)">
    <rect width="1100" height="640" rx="14" fill="#cfeef3" stroke="#203e36" stroke-width="3"/>
    <!-- sea + landmass (fictional peninsula) -->
    <path d="M70,600 C40,470 120,380 170,300 C210,230 260,160 360,120 C470,80 560,70 640,90 C760,110 820,60 900,90 C990,130 1040,220 1030,320 C1020,420 960,500 880,560 C760,630 600,620 470,610 C330,600 190,640 70,600 Z" fill="#e9f3d6" stroke="#8aa36a" stroke-width="2"/>
    <!-- W1 forest & river (south-west) -->
    <path d="M90,590 C80,500 140,430 220,420 C300,410 360,470 350,540 C340,600 220,615 90,590 Z" fill="#79c97a" stroke="#2f7d45" stroke-width="2"/>
    <path d="M120,470 C170,500 220,480 260,520 C300,555 330,560 360,600" fill="none" stroke="#3d9be9" stroke-width="5"/>
    <!-- W2 limestone valley -->
    <path d="M330,430 C320,360 380,300 460,300 C540,300 580,360 570,430 C560,490 470,510 400,500 C350,490 335,470 330,430 Z" fill="#c9cfc8" stroke="#6d756e" stroke-width="2"/>
    <path d="M370,440 l15,-60 l15,60 M410,450 l18,-80 l18,80 M460,440 l14,-55 l14,55 M505,445 l16,-70 l16,70" fill="#b2b9b1" stroke="#6d756e" stroke-width="2"/>
    <!-- W3 industrial / tin mining -->
    <path d="M580,470 C590,400 650,370 720,380 C790,390 820,450 800,510 C780,560 690,570 630,550 C595,535 578,505 580,470 Z" fill="#d7a87a" stroke="#8a5a2b" stroke-width="2"/>
    <rect x="650" y="430" width="22" height="40" fill="#8a8f99"/><rect x="680" y="415" width="30" height="55" fill="#e06a2b"/><rect x="718" y="440" width="18" height="30" fill="#8a8f99"/>
    <!-- W4 highland farms -->
    <path d="M520,250 C520,180 600,140 680,150 C760,160 800,220 780,280 C760,330 680,345 610,330 C555,318 520,295 520,250 Z" fill="#a9d68a" stroke="#4f8a3a" stroke-width="2"/>
    <path d="M560,280 q40,-20 80,0 q40,20 80,0 M560,300 q40,-20 80,0 q40,20 80,0" fill="none" stroke="#4f8a3a" stroke-width="2"/>
    <!-- future regions -->
    <path d="M860,520 C900,470 970,470 1000,420 L1010,470 C980,540 920,570 860,560 Z" fill="#9fd7c7" stroke="#2e8a7a" stroke-width="2" stroke-dasharray="6,4"/>
    <path d="M820,240 C840,190 900,170 950,190 C990,210 990,270 960,300 C920,330 850,320 825,290 Z" fill="#7fb98a" stroke="#2f6d45" stroke-width="2" stroke-dasharray="6,4"/>
    <path d="M300,170 C330,120 400,100 440,120 C470,140 450,200 400,215 C350,228 300,215 300,170 Z" fill="#eef6ff" stroke="#7d9ab8" stroke-width="2" stroke-dasharray="6,4"/>
    <path d="M335,170 l25,-45 l25,45 z M380,175 l20,-35 l20,35 z" fill="#ffffff" stroke="#7d9ab8"/>
    <path d="M880,360 C900,330 960,330 975,360 C985,390 950,410 915,405 C890,400 872,385 880,360 Z" fill="#b8bec9" stroke="#555d6b" stroke-width="2" stroke-dasharray="6,4"/>
    <!-- route between worlds -->
    <path d="M210,520 C280,500 330,470 450,410 C540,370 600,450 690,470 C720,380 660,300 650,250 C760,250 860,260 900,250 M690,470 C780,470 860,500 930,500 M450,410 C420,330 390,240 370,180 M650,250 C760,330 900,370 925,375" fill="none" stroke="#203e36" stroke-width="2.5" stroke-dasharray="3,7" stroke-linecap="round"/>
    <!-- nodes -->
    <g font-size="13" font-weight="bold" fill="#203e36">
      <circle cx="210" cy="520" r="22" fill="#2f9d55" stroke="#fff" stroke-width="4"/><text x="210" y="525" text-anchor="middle" fill="#fff">1</text>
      <text x="140" y="565">Hutan &amp; Sungai</text><text x="140" y="582" font-weight="normal" font-size="11">Fungsi · Selesai 2/3 · Tersedia 3/3</text>
      <circle cx="450" cy="410" r="22" fill="#d7a21f" stroke="#fff" stroke-width="4"/><text x="450" y="415" text-anchor="middle" fill="#203e36">2</text>
      <text x="390" y="345">Lembah Batu Kapur</text><text x="390" y="362" font-weight="normal" font-size="11">F. Kuadratik · DALAM PEMBANGUNAN</text>
      <circle cx="690" cy="470" r="20" fill="#9aa3a0" stroke="#fff" stroke-width="4"/><text x="690" y="475" text-anchor="middle" fill="#fff">3</text>
      <text x="640" y="535">Kilang &amp; Lombong</text><text x="640" y="551" font-weight="normal" font-size="11">Sistem Persamaan · AKAN DATANG</text>
      <circle cx="650" cy="250" r="20" fill="#9aa3a0" stroke="#fff" stroke-width="4"/><text x="650" y="255" text-anchor="middle" fill="#fff">4</text>
      <text x="575" y="200">Tanah Tinggi Ladang</text><text x="575" y="216" font-weight="normal" font-size="11">Indeks, Surd &amp; Log · AKAN DATANG</text>
      <circle cx="930" cy="500" r="14" fill="#c9d3d0" stroke="#fff" stroke-width="3"/><text x="880" y="590" font-size="11">Pantai &amp; Bakau (?)</text>
      <circle cx="900" cy="250" r="14" fill="#c9d3d0" stroke="#fff" stroke-width="3"/><text x="860" y="180" font-size="11">Kanopi Hutan Hujan (?)</text>
      <circle cx="370" cy="180" r="14" fill="#c9d3d0" stroke="#fff" stroke-width="3"/><text x="300" y="95" font-size="11">Tanah Tinggi Salji — FANTASI (?)</text>
      <circle cx="925" cy="375" r="14" fill="#c9d3d0" stroke="#fff" stroke-width="3"/><text x="890" y="425" font-size="11">Bandar Mekanikal (?)</text>
    </g>
    <!-- selected world panel -->
    <g transform="translate(770,12)">
      <rect width="300" height="150" rx="10" fill="#fffdf5" stroke="#203e36" stroke-width="2"/>
      <text x="14" y="26" font-size="14" font-weight="bold" fill="#203e36">World 1 · Hutan &amp; Sungai</text>
      <g font-size="12" fill="#203e36">
        <rect x="14" y="40" width="272" height="28" rx="6" fill="#e3f4e7" stroke="#2f9d55"/><text x="22" y="59">1-1 Jejak Taman Fungsi · ✓ · 12/15 syiling</text>
        <rect x="14" y="74" width="272" height="28" rx="6" fill="#e3f4e7" stroke="#2f9d55"/><text x="22" y="93">1-2 Jambatan Berkembar · ✓</text>
        <rect x="14" y="108" width="272" height="28" rx="6" fill="#fff4d6" stroke="#d7a21f"/><text x="22" y="127">1-3 Gerbang Songsang · SAMBUNG ▶</text>
      </g>
    </g>
    <text x="20" y="625" font-size="11" fill="#5a6e68">Klik/tekan nod → panel level (Main, Sambung, Main semula). Nod "?" = tema masa depan, belum dipadankan muktamad dengan bab.</text>
  </g>
  <!-- mobile frame -->
  <g transform="translate(1160,70)">
    <rect width="440" height="640" rx="26" fill="#f4f8f6" stroke="#203e36" stroke-width="3"/>
    <text x="24" y="40" font-size="16" font-weight="bold" fill="#203e36">Peta Dunia</text>
    <rect x="20" y="56" width="400" height="90" rx="12" fill="#79c97a" stroke="#2f7d45" stroke-width="2"/>
    <text x="34" y="82" font-size="14" font-weight="bold" fill="#123">1 · Hutan &amp; Sungai</text><text x="34" y="100" font-size="11" fill="#123">Fungsi · Selesai 2/3 · Tersedia 3/3</text>
    <rect x="34" y="110" width="260" height="10" rx="5" fill="#ffffff"/><rect x="34" y="110" width="200" height="10" rx="5" fill="#2f7d45"/>
    <rect x="310" y="96" width="96" height="36" rx="18" fill="#203e36"/><text x="358" y="119" font-size="13" fill="#fff2ce" text-anchor="middle" font-weight="bold">SAMBUNG</text>
    <rect x="20" y="158" width="400" height="90" rx="12" fill="#c9cfc8" stroke="#6d756e" stroke-width="2"/>
    <text x="34" y="184" font-size="14" font-weight="bold" fill="#123">2 · Lembah Batu Kapur</text><text x="34" y="202" font-size="11" fill="#123">F. Kuadratik · dalam pembangunan</text>
    <rect x="310" y="198" width="96" height="36" rx="18" fill="#ffffff" stroke="#6d756e"/><text x="358" y="221" font-size="12" fill="#444" text-anchor="middle">Pratonton</text>
    <rect x="20" y="260" width="400" height="70" rx="12" fill="#ead6c2" stroke="#8a5a2b" stroke-width="2" opacity=".75"/>
    <text x="34" y="290" font-size="14" font-weight="bold" fill="#123">3 · Kilang &amp; Lombong</text><text x="34" y="308" font-size="11" fill="#123">Akan datang</text>
    <rect x="20" y="342" width="400" height="70" rx="12" fill="#d5eac6" stroke="#4f8a3a" stroke-width="2" opacity=".75"/>
    <text x="34" y="372" font-size="14" font-weight="bold" fill="#123">4 · Tanah Tinggi Ladang</text><text x="34" y="390" font-size="11" fill="#123">Akan datang</text>
    <text x="24" y="440" font-size="12" fill="#5a6e68">Telefon: senarai kad menegak (boleh skrol),</text>
    <text x="24" y="458" font-size="12" fill="#5a6e68">tekan kad → helaian level di bawah.</text>
    <text x="24" y="476" font-size="12" fill="#5a6e68">Landskap: peta kecil di kiri + kad di kanan.</text>
    <rect x="20" y="500" width="400" height="120" rx="12" fill="#fffdf5" stroke="#203e36" stroke-width="2"/>
    <text x="34" y="526" font-size="13" font-weight="bold" fill="#203e36">Helaian level · World 1</text>
    <text x="34" y="550" font-size="12" fill="#203e36">1-1 ✓   1-2 ✓   1-3 ▶ Sambung</text>
    <text x="34" y="574" font-size="12" fill="#203e36">Main semula · Mod teroka (rahsia tertinggal)</text>
    <text x="34" y="598" font-size="12" fill="#203e36">Kemajuan dibaca daripada simpanan setiap level</text>
  </g>
</svg>
