<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self';">
  <title>DENAI · Bilik ujian Dunia 2 (Stesen A)</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="src/orientation.css">
  <link rel="stylesheet" href="src/v14/levels/w2/lab.css">
  <script defer src="vendor/phaser-3.90.0.min.js"></script>
  <script type="module" src="src/v14/levels/w2/lab.js"></script>
  <script type="module" src="src/orientation.js"></script>
</head>
<body>
  <main class="lab">
    <div id="lab-frame" class="lab-frame">
      <div id="lab-game" tabindex="0" role="group" aria-label="Bilik ujian. A dan D bergerak, Space lompat. Di tuil: Q dan E ubah a, F kunci lengkung."></div>
      <section class="lab-hud" aria-label="Pancur Lengkung">
        <p class="lab-tag">Dunia 2 · Lembah Batu Kapur · 2-1 · Stesen A <span>bilik ujian</span></p>
        <p id="lab-eq" class="lab-eq">y = a(x − 3)² + 4</p>
        <p id="lab-why" class="lab-why"></p>
        <p id="lab-state" class="lab-state" role="status" aria-live="polite">Lengkung bebas. Ubah a, kemudian kunci.</p>
      </section>
      <p id="lab-cue" class="lab-cue" role="status" aria-live="polite"></p>
      <div id="lab-tools" class="lab-tools far" aria-label="Tuil Pancur Lengkung">
        <button type="button" data-action="aDown" aria-label="Kurangkan a">a −</button>
        <output id="lab-a" class="lab-a" aria-label="Nilai a semasa">1</output>
        <button type="button" data-action="aUp" aria-label="Tambah a">a +</button>
        <button type="button" id="lab-lock" data-action="lock" class="lab-lock" aria-pressed="false">Kunci</button>
      </div>
      <div id="lab-touch" class="lab-touch" hidden>
        <div><button type="button" data-hold="left" aria-label="Kiri">←</button><button type="button" data-hold="right" aria-label="Kanan">→</button></div>
        <div><button type="button" data-action="jump" class="jump">Lompat</button></div>
      </div>
    </div>
  </main>
</body>
</html>
